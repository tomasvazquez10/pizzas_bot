name: Monitor Google Calendar

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite probar la ejecución manualmente desde el panel

jobs:
  check-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar versión de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar librerías requeridas
        run: pip install -r requirements.txt

      - name: 4. Ejecutar el script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python api/check.py